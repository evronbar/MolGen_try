[train_config]
batch_size = 32
gradient_accumulation_steps = 8
learning_rate = 8e-5
max_steps = 4000
weight_decay = 1e-1
betas = [0.9, 0.95]
grad_clip = 1.0
decay_lr = true
warmup_steps = 2000
lr_decay_steps = 30000
min_lr = 5e-6
dtype = "bfloat16"
compile = false
device = "cuda"
seed = 42
wandb_log = true
num_workers = 1
load_checkpoint = false
eval_every = 10
log_every = 10

[model_config]
vocab_size = 37
block_size = 300
max_seq_len = 100
n_embd = 100
n_head = 5
n_layer = 3
dropout = 0.2
model_type = "reward_conditioned"
n_goals = 2

[reward]
goal_conditioned = true

[[reward.functions]]
type = "QED"

[[reward.functions]]
type = "PlogP"
scale.name = "mult"
scale.factor = 0.1