[train_config]
batch_size = 16
gradient_accumulation_steps = 64
learning_rate = 1e-4
max_steps = 1000000
weight_decay = 1e-1
betas = [0.9, 0.95]
grad_clip = 1.0
decay_lr = true
warmup_steps = 2000
lr_decay_steps = 300000
min_lr = 1e-5
dtype = "float32"
compile = true
device = "cpu"
seed = 42
wandb_log = false
num_workers = 1
load_checkpoint = false
eval_every = 10
log_every = 10

[model_config]
vocab_size = 37
block_size = 300
max_seq_len = 100
n_embd = 768
n_head = 12
n_layer = 12
dropout = 0.1
model_type = "reward_conditioned"
n_goals = 1

[reward]

[[reward.functions]]
type = "QED"